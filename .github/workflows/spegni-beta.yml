name: Spegni la beta

# Usato una volta sola (24/10/2026): la beta è finita, al suo indirizzo si mette un rimando al gioco vero.
on:
  workflow_dispatch:

jobs:
  spegni:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          mkdir -p dist
          echo '/* https://alfa40.github.io/hustle-idle/ 301' > dist/_redirects
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://alfa40.github.io/hustle-idle/"><title>Hustle Idle</title><p>La versione di prova è finita: <a href="https://alfa40.github.io/hustle-idle/">gioca a Hustle Idle</a></p>' > dist/index.html
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hustle-anteprime --branch=beta --commit-dirty=true
